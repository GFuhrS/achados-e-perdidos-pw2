quarkus.http.port=8082
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${SOLICITACOES_DB_USER:solicitacoes}
quarkus.datasource.password=${SOLICITACOES_DB_PASSWORD:solicitacoes_local}
quarkus.datasource.jdbc.url=${SOLICITACOES_DB_URL:jdbc:mysql://localhost:3307/solicitacoes_db}
quarkus.hibernate-orm.schema-management.strategy=update
mp.jwt.verify.issuer=pw2-achados-e-perdidos
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:../secrets/publicKey.pem}
quarkus.rest-client.objetos-api.url=${OBJETO_SERVICE_URL:http://localhost:8081}
org.eclipse.microprofile.rest.client.propagateHeaders=Authorization
quarkus.micrometer.export.prometheus.enabled=true
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:solicitacoes;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.datasource.devservices.enabled=false
