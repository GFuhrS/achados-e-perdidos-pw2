quarkus.http.port=8081
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${OBJETOS_DB_USER:objetos}
quarkus.datasource.password=${OBJETOS_DB_PASSWORD:objetos_local}
quarkus.datasource.jdbc.url=${OBJETOS_DB_URL:jdbc:mysql://localhost:3307/objetos_db}
quarkus.hibernate-orm.schema-management.strategy=update
mp.jwt.verify.issuer=pw2-achados-e-perdidos
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:../secrets/publicKey.pem}
quarkus.micrometer.export.prometheus.enabled=true
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:objetos;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.datasource.devservices.enabled=false
